# Staging on Azure Static Web Apps (never indexed, base '/'):
# - every pull request gets its own preview URL, commented on the pull request, removed when it closes;
# - the branch staging deploys to the stable staging URL.
# Production stays on GitHub Pages (deploy.yml, after ci passes on main).
name: staging

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    environment:
      name: uat
      url: ${{ steps.swa.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build (staging)
        env:
          BASE_PATH: ""
          PUBLIC_STAGING: "true"
        run: |
          set -euo pipefail
          bash scripts/build.sh
          cp staging/staticwebapp.config.json staging/robots.txt _site/
          rm -f _site/sitemap-index.xml _site/sitemap-0.xml
      - id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true
          skip_api_build: true
          production_branch: staging

  close:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: _site
